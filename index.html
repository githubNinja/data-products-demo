<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Security: only files from this site may load. No CDNs, no inline scripts or styles. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <!-- Internal page: ask search engines not to index it -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Overview of the data platform: layers, architecture, and data products.">
  <title>Data Platform Overview</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- Edit content.js to change what the page says. app.js draws the page from it. -->
  <script src="assets/js/content.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="notice" id="notice" hidden></div>

  <header class="wrap nav">
    <a class="brand" href="#top" id="top">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <rect class="logo-a" x="1" y="1" width="9" height="9" rx="2"/>
        <rect class="logo-b" x="12" y="1" width="9" height="9" rx="2"/>
        <rect class="logo-b" x="1" y="12" width="9" height="9" rx="2"/>
        <rect class="logo-c" x="12" y="12" width="9" height="9" rx="2"/>
      </svg>
      <span data-bind="brand"></span>
    </a>
    <nav class="nav-links" aria-label="Sections">
      <a href="#platform">Platform</a>
      <a href="#architecture">Architecture</a>
      <a href="#products">Data products</a>
    </nav>
    <a href="#architecture" class="btn btn-primary">See the architecture</a>
  </header>

  <main id="main">
    <!-- Hero -->
    <section class="wrap hero">
      <p class="eyebrow" data-bind="eyebrow"></p>
      <h1 data-bind="headline"></h1>
      <p class="lead" data-bind="sub"></p>
      <div class="actions">
        <a href="#platform" class="btn btn-primary">Explore the platform</a>
        <a href="#products" class="btn btn-ghost">Browse data products</a>
      </div>
      <div class="flow" id="flow" aria-label="Data flow from sources to consumers">
        <div class="rail" aria-hidden="true"><span class="pkt"></span><span class="pkt"></span><span class="pkt"></span></div>
      </div>
    </section>

    <!-- Value props -->
    <section class="wrap">
      <div class="values" id="values"></div>
    </section>

    <!-- Platform pillars -->
    <section class="wrap" id="platform">
      <p class="eyebrow" data-bind="platform.eyebrow"></p>
      <h2 data-bind="platform.title"></h2>
      <div class="tabs" role="tablist" id="tabs" aria-label="Platform layers"></div>
      <div class="progress" id="progress" aria-hidden="true"><i></i></div>
      <div id="panels"></div>
    </section>

    <!-- Architecture -->
    <section class="wrap" id="architecture">
      <p class="eyebrow" data-bind="architecture.eyebrow"></p>
      <h2 data-bind="architecture.title"></h2>
      <p class="lead" data-bind="architecture.intro"></p>
      <div class="arch-layout">
        <div class="arch-scroll"><div class="arch" id="arch"></div></div>
        <aside class="panel detail" id="detail" aria-live="polite">
          <p class="eyebrow" id="d-col"></p>
          <h3 id="d-name"></h3>
          <span class="chip" id="d-tech"></span>
          <p id="d-text"></p>
          <p class="muted small" id="d-feeds"></p>
        </aside>
      </div>
    </section>

    <!-- Data products -->
    <section class="wrap" id="products">
      <p class="eyebrow" data-bind="products.eyebrow"></p>
      <h2 data-bind="products.title"></h2>
      <div class="panel table-scroll">
        <table>
          <thead>
            <tr><th>Product</th><th>Owner</th><th>Freshness</th><th class="num">Uptime (30d)</th><th class="num">Weekly users</th><th>Status</th></tr>
          </thead>
          <tbody id="product-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- Closing -->
    <section class="wrap closing">
      <h2 data-bind="cta.title"></h2>
      <p class="muted" data-bind="cta.text"></p>
      <div class="actions center">
        <a href="#platform" class="btn btn-primary">Start onboarding</a>
        <a href="#architecture" class="btn btn-ghost">Review the architecture</a>
      </div>
      <p class="footnote" data-bind="footer"></p>
    </section>
  </main>

  <noscript><p class="wrap">This page needs JavaScript turned on to show its content.</p></noscript>
</body>
</html>
